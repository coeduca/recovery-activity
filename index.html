<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥕</text></svg>">
  <title>Actividades de Recuperación | English Ecosystem</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #171717;
      --cream: #F3E9D2;
      --cream-light: #FAF1DE;
      --pink: #ED8FB3;
      --green: #79C99E;
      --orange: #F2A365;
      --blue: #78C4E4;
      --yellow: #EFD05A;
    }

    html {
      color-scheme: light;
    }

    body {
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      padding: clamp(1rem, 3vw, 2.25rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 12%, rgba(237, 143, 179, 0.74) 0 8%, transparent 8.25%),
        radial-gradient(circle at 92% 14%, rgba(239, 208, 90, 0.78) 0 9%, transparent 9.25%),
        radial-gradient(circle at 90% 88%, rgba(121, 201, 158, 0.76) 0 10%, transparent 10.25%),
        linear-gradient(135deg, #78C4E4 0%, #9AD2E6 48%, #F2A365 100%);
    }

    button,
    input {
      font: inherit;
    }

    .brutal-container {
      position: relative;
      width: min(100%, 610px);
      padding: clamp(1.25rem, 5vw, 2.7rem);
      background-color: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 22px;
      overflow: hidden;
    }

    .brutal-container::before {
      content: "";
      display: block;
      width: 100%;
      height: 13px;
      margin-bottom: 1.4rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--pink) 0 25%,
        var(--green) 25% 50%,
        var(--orange) 50% 75%,
        var(--blue) 75% 100%
      );
    }

    h1 {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 1rem;
      padding: 12px 17px;
      background-color: var(--yellow);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 14px;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      font-size: clamp(2.3rem, 9vw, 3.7rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .brutal-container > p {
      margin-bottom: 1.5rem;
      padding: 14px 16px;
      background-color: var(--blue);
      border: 3px solid var(--ink);
      border-radius: 13px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1rem;
      padding: 15px;
      background-color: #A7D7B9;
      border: 3px solid var(--ink);
      border-radius: 14px;
    }

    label {
      display: block;
      margin-bottom: 0.65rem;
      font-size: 0.98rem;
      font-weight: 900;
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      min-height: 56px;
      padding: 0.9rem 1rem;
      color: var(--ink);
      background-color: var(--cream-light);
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      outline: none;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.045em;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    input[type="text"]::placeholder {
      color: #665f54;
      opacity: 0.78;
      font-weight: 600;
      letter-spacing: 0;
    }

    input[type="text"]:focus {
      background-color: #C9E7F1;
      transform: translateY(-1px);
    }

    input[type="text"]:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .brutal-btn {
      display: block;
      width: 100%;
      min-height: 58px;
      padding: 1rem 1.2rem;
      color: var(--ink);
      background-color: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 12px;
      cursor: pointer;
      font-size: clamp(1.05rem, 4vw, 1.3rem);
      font-weight: 900;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .brutal-btn:hover {
      background-color: var(--pink);
      transform: translateY(-2px);
    }

    .brutal-btn:active {
      transform: translateY(0);
    }

    .brutal-btn:disabled {
      color: var(--ink) !important;
      opacity: 1;
      cursor: wait;
    }

    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 1.35rem;
    }

    .badge {
      padding: 7px 11px;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge-teal { background-color: var(--blue); }
    .badge-pink { background-color: var(--pink); }
    .badge-green { background-color: var(--green); }

    /* Modal con el mismo brutalismo suave */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background-color: rgba(23, 23, 23, 0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .brutal-modal {
      width: min(100%, 460px);
      padding: clamp(1.25rem, 5vw, 2rem);
      background-color: var(--cream);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 18px;
      text-align: center;
      transform: translateY(14px) scale(0.97);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .brutal-modal {
      transform: translateY(0) scale(1);
    }

    .brutal-modal h2 {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 9px 15px;
      color: var(--ink);
      background-color: var(--pink);
      border: 3px solid var(--ink);
      border-radius: 12px;
      font-size: clamp(1.8rem, 8vw, 2.55rem);
      font-weight: 900;
      letter-spacing: 0.025em;
    }

    .brutal-modal p {
      margin: 0;
      padding: 13px 14px;
      color: var(--ink);
      background-color: #F3C18E;
      border: 2.5px solid var(--ink);
      border-radius: 11px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .modal-close-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      color: var(--ink);
      background-color: var(--green);
      border: 3px solid var(--ink);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 900;
      text-transform: uppercase;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .modal-close-btn:hover {
      background-color: var(--blue);
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
      }

      .brutal-container {
        border-radius: 17px;
      }

      .brutal-container::before {
        height: 11px;
        margin-bottom: 1.1rem;
      }

      h1 {
        width: 100%;
        text-align: center;
      }

      .badge-container {
        display: grid;
        grid-template-columns: 1fr;
      }

      .badge {
        text-align: center;
      }
    }
  </style>
  <script src="students.js"></script>
  <script src="rigo.js"></script>
</head>
<body>

  <div class="brutal-container">
    <h1>RECOVERY!</h1>
    <p>Bienvenido al portal de Actividades de Recuperación. ¡Rigo ya está listo en su esquina para darte los mejores hints!</p>

    <div class="form-group">
      <label for="student-nie">Ingresa tu NIE:</label>
      <input type="text" id="student-nie" placeholder="Ej. 20138868" autocomplete="off" maxlength="12">
    </div>

    <button class="brutal-btn" id="enter-btn">¡INGRESAR AHORA!</button>

    <div class="badge-container">
      <span class="badge badge-teal">Teacher Eliseo</span>
      <span class="badge badge-pink">English Class</span>
      <span class="badge badge-green">Coeduca 2026</span>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="brutal-modal">
      <h2>ALERT!</h2>
      <p id="modal-message">No se encontraron actividades vigentes para los parámetros ingresados.</p>
      <button class="modal-close-btn" id="modal-close">CERRAR VENTANA</button>
    </div>
  </div>

  <rigo-mascot id="rigo-companion" grade="Séptimo"></rigo-mascot>

  <script>
    // CRONOGRAMA DE ACTIVIDADES 2026
    const ACTIVITIES_TIMELINE = {
      "Séptimo": [
        { start: "2026-05-16", end: "2026-08-30", url: "septimo/recuperacion2.html" }
      ],
      "Octavo": [
        { start: "2026-05-16", end: "2026-08-30", url: "octavo/recuperacion2.html" }
      ],
      "Noveno": [
        { start: "2026-05-16", end: "2026-08-30", url: "noveno/recuperacion2.html" }
      ],
      "Primer Año": [
        { start: "2026-05-16", end: "2026-08-30", url: "primer_ano/recuperacion2.html" }
      ],
      "Segundo Año": [
        { start: "2026-05-16", end: "2026-08-30", url: "segundo_ano/recuperacion2.html" }
      ]
    };

    document.addEventListener('DOMContentLoaded', () => {
      const rigo = document.getElementById('rigo-companion');
      const nieInput = document.getElementById('student-nie');
      const enterBtn = document.getElementById('enter-btn');
      
      const modalOverlay = document.getElementById('modal-overlay');
      const modalMessage = document.getElementById('modal-message');
      const modalClose = document.getElementById('modal-close');

      setTimeout(() => {
        if (rigo && typeof rigo.welcome === 'function') rigo.welcome();
      }, 1500);

      // Sincronizar dinámicamente a Rigo con el grado del alumno a medida que escribe
      nieInput.addEventListener('input', (e) => {
        const nieValue = e.target.value.trim();
        const db = window.STUDENTS || {};
        const student = db[nieValue];

        if (student && rigo && typeof rigo.setGrade === 'function') {
          rigo.setGrade(student.grade);
        }
      });

      modalClose.addEventListener('click', () => {
        modalOverlay.classList.remove('active');
        if (rigo) rigo.setEmotion('neutral');
      });

      enterBtn.addEventListener('click', () => {
        const nieValue = nieInput.value.trim();

        if (nieValue === "") {
          if (rigo && typeof rigo.say === 'function') {
            rigo.setEmotion('angry');
            rigo.say("¡Oye! Rigo dice que no puedes entrar sin poner tu NIE.", 4000);
          }
          nieInput.focus();
          return;
        }

        // Acceder al objeto global desde students.js
        const db = window.STUDENTS || {};
        const student = db[nieValue];

        if (!student) {
          if (rigo) rigo.setEmotion('confused');
          modalMessage.textContent = `Acceso denegado. El NIE [${nieValue}] no figura en el registro oficial.`;
          modalOverlay.classList.add('active');
          return;
        }

        // Obtener automáticamente el grado desde la base de datos
        const selectedGrade = student.grade;
        if (rigo && typeof rigo.setGrade === 'function') {
          rigo.setGrade(selectedGrade);
        }

        // Simulación controlada por reloj del sistema (Hoy: Julio 2026)
        const today = new Date();
        const activeActivities = ACTIVITIES_TIMELINE[selectedGrade] || [];
        let targetUrl = null;

        for (let period of activeActivities) {
          const start = new Date(period.start + "T00:00:00");
          const end = new Date(period.end + "T23:59:59");

          if (today >= start && today <= end) {
            targetUrl = period.url;
            break;
          }
        }

        if (targetUrl) {
          if (rigo && typeof rigo.loginSuccess === 'function') {
            rigo.loginSuccess(student.name);
            
            enterBtn.disabled = true;
            enterBtn.textContent = "ABRIENDO ACTIVIDAD...";
            enterBtn.style.backgroundColor = "#79C99E";
            enterBtn.style.color = "#171717";

            setTimeout(() => {
              window.location.href = `${targetUrl}?nie=${nieValue}&student=${encodeURIComponent(student.name)}`;
            }, 3500);
          }
        } else {
          if (rigo) rigo.setEmotion('sad');
          modalMessage.textContent = `¡Hola, ${student.name}! Tus datos son correctos, pero actualmente no hay ningún proceso abierto para ${selectedGrade}.`;
          modalOverlay.classList.add('active');
        }
      });
    });

    // SOLUCIÓN AL ESTADO DEL BOTÓN AL VOLVER ATRÁS
    window.addEventListener('pageshow', (event) => {
      const enterBtn = document.getElementById('enter-btn');
      if (enterBtn) {
        enterBtn.disabled = false;
        enterBtn.textContent = "¡INGRESAR AHORA!";
        enterBtn.style.backgroundColor = "#EFD05A";
        enterBtn.style.color = "#171717";
      }
    });
  </script>
</body>
</html>
